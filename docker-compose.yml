services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learning_tracker
      POSTGRES_PASSWORD: learning_tracker
      POSTGRES_DB: learning_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_tracker"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
