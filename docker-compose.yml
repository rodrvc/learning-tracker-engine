services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learning_tracker
      POSTGRES_PASSWORD: learning_tracker
      POSTGRES_DB: learning_tracker
    ports:
      # The host port is configurable because 5432 is very often already
      # taken by another project's database. The container port never
      # changes, so LEARNING_TRACKER_TEST_DATABASE_URL is the only other
      # thing to line up.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_tracker"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
