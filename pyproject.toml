[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-tracker"
version = "0.1.0"
description = "Learning tracking engine: attempts, levels and spaced repetition. The contract lives in SPEC.md."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
learning-tracker = "ui.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary,pool]>=3.1",
    # Verifies a Clerk session against its JWKS (ACU-278). The `crypto`
    # extra pulls in `cryptography` for RS256 - Clerk's signing algorithm -
    # rather than this leaning on a hand-rolled verifier.
    "PyJWT[crypto]>=2.9,<3",
    # The web application wires a generator at startup, so the generation
    # package is not optional for it. Leaving it out did not degrade
    # generation gracefully, it stopped the application from importing at
    # all: uploading, reading, practising and progress went down with it.
    "learning-tracker[generate]",
]
generate = ["openai>=2.0", "pydantic>=2.0"]

[tool.setuptools]
# `webui` has no `.py` files, so it needs its own package-data entry below or
# a wheel install leaves `WEBUI_DIR` (web/app.py) pointing at nothing and
# `create_app` dies at `StaticFiles` construction instead of serving a page.
packages = ["core", "store", "ui", "migrations", "content", "web", "web.routers", "generate", "webui"]

[tool.setuptools.package-data]
# A glob, not an enumeration: a hand-kept list silently stops shipping the
# first file that lands in a new directory, and `StaticFiles` still
# constructs, so the failure is a 404 in production with a green suite.
webui = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
markers = [
    "spec: verifies a concrete rule of SPEC.md",
    "invariant: verifies an invariant of SPEC.md section 6",
    "edge: verifies an edge case of SPEC.md section 7",
]
