name: secret-scan

on:
  # Incremental cover: every pull request, and every push to the default
  # branch. On these events the scanner only examines the commits in the
  # event's range, so they catch a secret as it arrives, not one already
  # sitting in the history.
  pull_request:
  push:
    branches: [main]
  # Full-history cover. These are the only two events where the scanner walks
  # the whole repository: it drops the commit-range restriction it applies to
  # push and pull_request. They are what catches a secret that was committed
  # and later removed, and a push of more than 20 commits, where the event
  # payload is truncated and the incremental scan silently sees only the last
  # 20.
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so the scheduled and manual runs have the whole history
          # to walk, and so pull request runs have the base commits present.
          fetch-depth: 0
      # Pinned to a commit: the floating tag would otherwise move under us,
      # and this is the gate that guards a public repository.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
